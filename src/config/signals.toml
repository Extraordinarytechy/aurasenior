# Voice change signals: per-feature floors and the only phrases a signal can produce.
# A signal is a suggestion to call, never a cause, a condition or a level.

[floors]
# floor = max(fraction * median, minimum)
words_per_minute = { fraction = 0.05, minimum = 1.0 }
pause_count = { fraction = 0.05, minimum = 1.0 }
pause_mean = { fraction = 0.05, minimum = 0.1 }
reply_delay = { fraction = 0.05, minimum = 0.1 }
word_count = { fraction = 0.05, minimum = 1.0 }
speaking_time = { fraction = 0.05, minimum = 0.1 }

[rules]
min_notes = 5
baseline_days = 14
threshold = 2.5
window = 5
needed = 3
min_words = 5
min_seconds = 3.0

# Feature phrases are neutral because a change is detected in either direction.
# Mention phrases report what was said, not how the person seemed.
[en]
opening = "Worth a call today: {relation_label}"
words_per_minute = "has been speaking differently from usual"
pause_count = "has been pausing differently from usual"
pause_mean = "has been pausing for different lengths from usual"
reply_delay = "has been replying at a different pace from usual"
word_count = "has been saying a different amount from usual"
speaking_time = "has been speaking for a different length of time from usual"
pain = "mentioned pain a few times"
low_mood = "mentioned feeling low a few times"
joiner = " and "
closing = " this week."

[hi]
opening = "आज फ़ोन कर लें: {relation_label}"
words_per_minute = "सामान्य से अलग ढंग से बोल रही हैं"
pause_count = "बोलते हुए सामान्य से अलग ढंग से रुक रही हैं"
pause_mean = "बोलते हुए सामान्य से अलग देर तक रुक रही हैं"
reply_delay = "जवाब देने में सामान्य से अलग समय ले रही हैं"
word_count = "सामान्य से अलग मात्रा में बोल रही हैं"
speaking_time = "सामान्य से अलग देर तक बोल रही हैं"
pain = "कई बार दर्द की बात कर चुकी हैं"
low_mood = "कई बार उदास होने की बात कर चुकी हैं"
joiner = " और "
closing = "।"
