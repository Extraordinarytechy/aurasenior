# Every fixed sentence the product sends, per phrase language. [<lang>] is for family, neighbour and care
# contacts; [<lang>.elder] is for the elder (spoken with Polly and also sent as short text).
# Placeholders: {brand} {relation_label} {display_label} {family_name} {elder_name} {admin_name} {quote}
# {pharmacy_name} {ack_name} {number} {name}

